# Template experiment config. Copy, change one thing, give it a new id.
id: b2-001
hypothesis: "Rank #1 hand-crafted features + U1-U0 target beat B0 rules in all three setups (A->B, B->A, mix)"
split:
  # ADR-0004. The dev/test split itself is fixed in configs/protocol.yaml and loaded from stored
  # patient-id lists; nothing here can change which patients are in dev or test.
  # run-experiment runs every setup listed here on dev data and logs A->B, B->A, mix->A and mix->B.
  #   A_to_B  pessimistic: train and tune on A-dev, evaluate on B-dev
  #   B_to_A  pessimistic: train and tune on B-dev, evaluate on A-dev
  #   mix     optimistic:  nested CV on A-dev + B-dev, reported for A and B patients separately
  setups: [A_to_B, B_to_A, mix]
  cv_seed: 0                 # CV folds only; separate from the dev/test split seed
  n_folds: 5                 # patient-level CV inside each training side; the threshold is tuned on its out-of-fold predictions
  n_inner_folds: 5           # mix only: inner CV in each outer fold to tune that fold's threshold
  stratify_by:
    single_hospital: [septic]
    mix: [hospital, septic]  # ids are hospital-prefixed (A_p000001)
features:
  impute: ffill_nan_before_first
  hand_crafted: [shock_index, bun_cr, partial_sofa, partial_sofa_delta_24h, hours_since_panel]
  vital_windows_h: [6]       # rolling max/min
  signatures: null           # B3: {window_h: 8, depth: 2, channels: [partial_sofa, MAP, bun_cr]}
  lab_masking_p: 0.3         # random lab hiding during training (ADR-0002)
target: utility_diff         # U1 - U0
model:
  type: lightgbm_regressor
  params: {n_estimators: 500, learning_rate: 0.05, num_leaves: 63, min_child_samples: 100}
note: ""

# Template experiment config. Copy, change one thing, give it a new id.
# Checked by sepsis.eval.experiment_config (ADR-0008): unknown keys are refused.
id: b1-001
hypothesis: "A linear model on the same features (ADR-0005 fills, log1p, scaling) beats B0 in all three setups"
seed: 0                      # panel-draw masking and the model (ADR-0008)
split:
  # ADR-0004. The dev/test split and the 5 CV folds are fixed in one split file (settings in
  # configs/protocol.yaml); nothing here can change which patients are in dev, test or each fold.
  # The runner runs every setup listed here on dev data and logs A->B, B->A, mix->A and mix->B.
  #   A_to_B  pessimistic: train and tune on A-dev (stored folds), evaluate on B-dev
  #   B_to_A  pessimistic: train and tune on B-dev (stored folds), evaluate on A-dev
  #   mix     optimistic:  nested CV over the stored folds on A-dev + B-dev, reported per hospital
  # A subset is allowed for a quick check; it is logged as a partial run and never used to keep a change.
  setups: [A_to_B, B_to_A, mix]
features:
  # Names of feature blocks in configs/features.yaml (core or extras); settings live there.
  # B2 = the rank #1 blocks plus SIRS (ours, ADR-0001): exactly the `core` section.
  hand_crafted: [shock_index, bun_cr, partial_sofa, partial_sofa_delta, sirs, vital_minmax, hours_since_panel]
  signatures: null           # B3: {window_h: 8, depth: 2, channels: [partial_sofa, MAP, bun_cr]}
  lab_masking_p: 0.3         # hide each panel draw with this probability, training only (ADR-0002, ADR-0006)
target: sepsis_label         # B1 needs a 0/1 target; weight 0 for septic hours with dt > 3
model:
  type: logistic             # B1 (sepsis.risk.logistic); fills and log labs: configs/preprocessing.yaml b1
  params:
    C: 1.0                   # inverse L2 strength
    max_iter: 1000
note: ""

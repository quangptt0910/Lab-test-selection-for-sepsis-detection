# Project-wide evaluation protocol (ADR-0004). Shared by every experiment, never copied into experiment configs.
# Do not change these values once the split has been created or any experiment has been logged.

split:
  seed: 0
  test_fraction: 0.2            # patient-level; stratifying by hospital x septic gives each hospital its own 80/20 split
  n_folds: 5                    # CV folds on dev, stored in the split file so every experiment uses the same folds
  stratify_by: [hospital, septic]
  # Created once by `python -m sepsis.data.make_split` (path in configs/data.yaml).
  # Set this to the fingerprint it prints; the loader then refuses any split file that differs.
  # SHA-256 over every column (patient_id, hospital, septic, split, fold).
  fingerprint: ec2e7a89a83e895696163989bacd3dac223438c2df47d449fba920cc540287cd

selection:
  # Keep a change only if mix improves and neither A->B nor B->A drops by more than this (utility).
  # project_assumption: fixed before the first comparison; do not change per experiment.
  cross_hospital_tolerance: 0.01

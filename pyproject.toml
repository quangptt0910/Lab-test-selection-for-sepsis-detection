[project]
name = "sepsis-cds"
version = "0.1.0"
description = "Sepsis risk, test-recommendation and guideline layer on PhysioNet/CinC 2019"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
signatures = ["iisignature>=0.24"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sepsis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real data or long training"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sepsis"]  # same import order from the edit hook and from `make check`
